name: Compilar APK de MiMúsica

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar plataforma Android 37 y build-tools
        # Si el nombre del paquete cambia, AGP descarga lo que falte automáticamente.
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pruebas unitarias y APK debug
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMusica-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK en Releases (descarga directa desde el celular)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiMusica.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MiMusica.apk --title "MiMúsica (última versión)" --notes "APK debug compilado desde ${GITHUB_SHA::7}." --prerelease

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore
